name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs are dry runs: everything except the npm publish and GitHub release.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint
        run: |
          npm run lint
          npm run format-check

      - name: Run tests with coverage
        run: npm run test-with-coverage

      - name: Build
        run: npm run build

      - name: Publish to npm (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version "0.0.0-dryrun.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --access public --tag dryrun --dry-run

      - name: Publish to npm
        if: github.ref_type == 'tag'
        run: npm publish --access public

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
