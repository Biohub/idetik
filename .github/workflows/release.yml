name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs are dry runs unless publish_prerelease is checked, in which case
  # a prerelease of the next patch version is published under the "next" dist-tag.
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish a prerelease (X.Y.Z-next.<sha>) to npm instead of a dry run'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint
        run: |
          npm run lint
          npm run format-check

      - name: Run tests with coverage
        run: npm run test-with-coverage

      - name: Build
        run: npm run build

      - name: Publish prerelease to npm
        if: github.event_name == 'workflow_dispatch'
        run: |
          next_patch="$(npm version patch --no-git-tag-version)"
          npm version "${next_patch#v}-next.$(git rev-parse --short HEAD)" --no-git-tag-version
          if [ "${{ inputs.publish_prerelease }}" = "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public --tag next --dry-run
          fi

      - name: Publish to npm
        if: github.ref_type == 'tag'
        run: npm publish --access public

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
