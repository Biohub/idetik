<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Viewports</title>
    <link rel="stylesheet" href="../lil_gui_theme.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #333333;
        font-family: sans-serif;
      }

      #container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        width: 100vw;
        height: 100vh;
      }

      .viewport {
        position: relative;
        border: 1px solid #555;
      }

      .viewport:nth-child(2n) {
        margin-left: -1px;
      }
      .viewport:nth-child(n + 3) {
        margin-top: -1px;
      }

      .viewport.active {
        border-color: #ffee66;
        z-index: 1;
      }

      .viewport-label {
        position: absolute;
        top: 10px;
        left: 10px;
        font-weight: bold;
        font-size: 12px;
        letter-spacing: 2px;
        user-select: none;
        pointer-events: none;
      }

      .axis-x {
        color: #ff0000;
      }

      .axis-y {
        color: #00ff00;
      }

      .axis-z {
        color: #0000ff;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="viewport" id="viewport-slice-xy">
        <span class="viewport-label">
          <span class="axis-x">X</span><span class="axis-y">Y</span>
        </span>
      </div>
      <div class="viewport" id="viewport-3d"></div>
      <div class="viewport" id="viewport-slice-xz">
        <span class="viewport-label">
          <span class="axis-x">X</span><span class="axis-z">Z</span>
        </span>
      </div>
      <div class="viewport" id="viewport-slice-yz">
        <span class="viewport-label">
          <span class="axis-y">Y</span><span class="axis-z">Z</span>
        </span>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const viewports = document.querySelectorAll(".viewport");
      const setActive = (targetElement) => {
        viewports.forEach((vp) => vp.classList.remove("active"));
        targetElement.classList.add("active");
      };

      viewports.forEach((v) => {
        v.addEventListener("mouseenter", () => {
          setActive(v);
        });
      });

      if (viewports.length > 0) setActive(viewports[0]);
    });
  </script>
</html>
