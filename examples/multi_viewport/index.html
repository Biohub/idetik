<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orthogonal Views of a Mouse Brain</title>
    <link rel="stylesheet" href="../example.css" />
    <style>
      html {
        background-color: #333333;
        font-family: sans-serif;
      }

      #container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        width: 100vw;
        height: 100vh;
      }

      .viewport {
        position: relative;
        border: 1px solid #555;
      }

      .viewport:nth-child(2n) {
        margin-left: -1px;
      }
      .viewport:nth-child(n + 3) {
        margin-top: -1px;
      }

      /* Round the outer corners to match the docs site's iframe (12px radius
         minus its 1px border), so the active border isn't clipped. */
      .viewport:nth-child(1) {
        border-top-left-radius: 11px;
      }
      .viewport:nth-child(2) {
        border-top-right-radius: 11px;
      }
      .viewport:nth-child(3) {
        border-bottom-left-radius: 11px;
      }
      .viewport:nth-child(4) {
        border-bottom-right-radius: 11px;
      }

      .viewport.active {
        border-color: #ffee66;
        z-index: 1;
      }

      .viewport-label {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 3px 6px;
        border-radius: 3px;
        background-color: rgba(0, 0, 0, 0.6);
        color: #dddddd;
        font-weight: bold;
        font-size: 12px;
        letter-spacing: 2px;
        user-select: none;
        pointer-events: none;
      }

      .axis-x {
        color: #ff6b6b;
      }

      .axis-y {
        color: #6bd96b;
      }

      .axis-z {
        color: #5c8dff;
      }

      /* The viewports are the divs, so the canvas sits behind them. */
      #canvas {
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="viewport" id="viewport-slice-xy">
        <span class="viewport-label">
          <span class="axis-x">X</span><span class="axis-y">Y</span>
        </span>
      </div>
      <div class="viewport" id="viewport-slice-yz">
        <span class="viewport-label">
          <span class="axis-y">Y</span><span class="axis-z">Z</span>
        </span>
      </div>
      <div class="viewport" id="viewport-slice-xz">
        <span class="viewport-label">
          <span class="axis-x">X</span><span class="axis-z">Z</span>
        </span>
      </div>
      <div class="viewport" id="viewport-3d">
        <span class="viewport-label">VOL</span>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
