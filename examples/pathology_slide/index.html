<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whole-Slide Pathology Image</title>
    <link rel="stylesheet" href="../lil_gui_theme.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        display: flex;
        width: 100%;
        height: 100%;
        background-color: black;
        font-family: monospace;
        font-size: 12px;
      }
      #main {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      #canvas {
        width: 100%;
        height: 100%;
      }
      #minimap {
        position: absolute;
        right: 1.3em;
        bottom: 1.5em;
        height: 18%;
        overflow: hidden;
        border: 1px solid rgb(0 0 0 / 0.3);
        border-radius: 4px;
        cursor: crosshair;
        touch-action: none;
      }
      #minimap-view {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid #00c853;
        background-color: rgb(0 200 83 / 0.2);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <canvas id="canvas"></canvas>
    </div>
    <div id="minimap"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
