<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Labels Overlay (3D)</title>
    <link rel="stylesheet" href="../lil_gui_theme.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        display: flex;
        width: 100%;
        height: 100%;
        color: white;
        background-color: black;
      }
      #main {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      #canvas {
        flex: 1;
        min-height: 0;
      }
      #pick-info-box {
        position: absolute;
        bottom: 1em;
        left: 1em;
        padding: 0.75em 1em;
        border: 1px solid rgb(255 255 255 / 0.1);
        border-radius: 8px;
        background-color: rgb(17 17 20 / 0.92);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.8em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <canvas id="canvas"></canvas>
      <div id="pick-info-box">
        <div id="pick-info">Click to pick a label value</div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
