<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCS Plate of A549 Cells</title>
    <link rel="stylesheet" href="../example.css" />
    <style>
      /* The tiles and field view are the viewports, so the canvas sits
         behind them. */
      #canvas {
        z-index: -1;
      }

      #breadcrumb {
        position: absolute;
        top: 0;
        left: 0;
        padding: 0.8em 1em;
        user-select: none;
      }

      #breadcrumb .link {
        color: #9b85fb;
        cursor: pointer;
      }

      #breadcrumb .link:hover {
        text-decoration: underline;
      }

      .level {
        position: absolute;
        inset: 2.8em 0.5em 0.5em 0.5em;
        display: grid;
        gap: 4px;
      }

      .level.hidden {
        display: none;
      }

      .tile {
        position: relative;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 4px;
        cursor: pointer;
      }

      .tile:hover {
        border-color: #9b85fb;
      }

      .tile .label {
        position: absolute;
        bottom: 0;
        left: 0;
        padding: 0.2em 0.5em;
        font-size: 10px;
        background-color: rgb(0 0 0 / 0.6);
        border-top-right-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="breadcrumb"></div>
    <div id="plate-grid" class="level"></div>
    <div id="well-grid" class="level hidden"></div>
    <div id="field-view" class="level hidden"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
